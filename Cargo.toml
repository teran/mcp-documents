[package]
name = "mcp-documents"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An MCP server that extracts clean text and Markdown from documents (PDF with OCR for scanned pages, plus MS Office / ODF / RTF / EPUB / CSV)."
license = "Apache-2.0"
readme = "README.md"

# ---------------------------------------------------------------------------
# Feature strategy
# ---------------------------------------------------------------------------
# Default build is fully pure-Rust: no C++ compiler / CMake / rus.traineddata
# are needed to compile or test locally. The heavy OCR stack (vendored
# Tesseract + Leptonica, embedded eng+rus tessdata) is gated behind the
# `ocr-native` feature, which is OFF by default and enabled in the Docker/CI
# build.
[features]
default = []
# Enables `tesseract-rs` with `embed-tessdata`. Requires a C++ compiler + CMake
# + internet at build time (compiles vendored Tesseract/Leptonica) and the
# `TESSERACT_EMBED_LANGUAGES=eng,rus` env var with pre-provisioned
# `rus.traineddata`. See SPEC §4.3.
ocr-native = ["dep:tesseract-rs"]

[dependencies]
# MCP framework. Default features include `server`; `transport-io` enables the
# stdio transport (`rmcp::transport::stdio`).
rmcp = { version = "3.1.4", features = ["server", "transport-io"] }
# Document -> Markdown engine (PDF via pdf-inspector internally).
anydoc = "0.2.4"
# Pure-Rust PDF page -> image rasterizer (no native deps).
pdf-render = "1.0.0-beta.18"
# Per-page PDF text extraction + per-page classification (real TextBased/
# Scanned/ImageBased/Mixed + page ranges). Used directly for the PDF path.
pdf-inspector = "1.17.0"
# Streaming CSV parsing (memory < file size) for the dedicated CSV adapter.
csv = "1.4"
# Reading .xls/.xlsx workbooks (sheet listing + sheet/row extraction).
calamine = "0.37"
# Reading PPTX slide parts (OOXML zip members) for slide count + ranges.
# Version 9 is required to stay clear of RUSTSEC-2026-0367/0368/0369 (the
# vulnerable SUID/symlink extraction bugs in the `zip` < 9 extraction API).
zip = { version = "9", default-features = false }
# Parsing slide XML (<a:t> text) when extracting PPTX slides.
quick-xml = "0.42"

tokio = { version = "1", features = ["full"] }
# Version ranges aligned with rmcp's re-exports so `rmcp::serde`/`rmcp::schemars`
# unify with the direct `serde`/`schemars` below (single instance in the tree).
serde = { version = "1", features = ["derive"] }
schemars = "1"
# Base64-decode for the optional `bytes` tool input (clients that pass the
# file content to the model as base64 instead of a path).
base64 = "0.23"
# Platform constants (O_NOFOLLOW) for TOCTOU-safe, symlink-rejecting opens in
# the file reader. Infrastructure-only.
libc = "0.2"
# SHA-256 of the embedded `rus.traineddata` model, verified at startup as a
# supply-chain guard. Infrastructure-only.
sha2 = "0.10"

# OCR (vendored Tesseract+Leptonica). Optional — only built with `ocr-native`.
tesseract-rs = { version = "0.4.0", features = ["embed-tessdata"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
