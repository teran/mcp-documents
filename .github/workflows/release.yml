# Release for mcp-documents.
#
# Triggered on every `v*` tag push. Runs the same quality gates as CI (fmt,
# clippy, test, audit, deny), then:
#   * builds the self-contained OCR binary (`--features ocr-native`) and uploads
#     it as a GitHub Release asset;
#   * builds the container image and pushes it to GHCR
#     (`ghcr.io/teran/mcp-documents:<tag>` and `:latest`).
#
# The full OCR build needs a C++ compiler + CMake + internet at build time and
# pre-provisioned `rus.traineddata` (tesseract-rs only auto-downloads eng/tur).

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: cargo deny check
        run: cargo deny check

  release-binary:
    name: release binary (ocr-native)
    needs: check
    runs-on: ubuntu-latest
    env:
      TESSERACT_EMBED_LANGUAGES: eng,rus
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build tools (C++ + CMake) and provisioning helpers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake curl
      - name: Provision rus.traineddata for tesseract-rs
        # SHA-256 matches RUS_TESSDATA_SHA256 (supply-chain guard).
        run: |
          mkdir -p "$HOME/.tesseract-rs/tessdata"
          curl -fL -o "$HOME/.tesseract-rs/tessdata/rus.traineddata" \
            "https://cdn.jsdelivr.net/gh/tesseract-ocr/tessdata_best@main/rus.traineddata"
          echo "b617eb6830ffabaaa795dd87ea7fd251adfe9cf0efe05eb9a2e8128b7728d6b6  $HOME/.tesseract-rs/tessdata/rus.traineddata" | sha256sum -c -
      - name: cargo build --release --features ocr-native
        run: cargo build --release --features ocr-native
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/mcp-documents
          generate_release_notes: true

  docker:
    name: publish container image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/teran/mcp-documents:${{ github.ref_name }}
            ghcr.io/teran/mcp-documents:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
