# cargo-deny configuration — run with `cargo deny check`.
# See https://embarkstudios.github.io/cargo-deny/
#
# The CI `deny` job runs `cargo deny check` (bans + licenses + advisories +
# sources) on every push/PR.

[graph]
# Check all features (including `ocr-native`) so the tesseract-rs dependency
# subtree is licensed too.
all-features = true

[licenses]
# cargo-deny config format v2 (see EmbarkStudios/cargo-deny#611): in this format
# `unlicensed` and `copyleft` default to `deny`, and any license NOT in the
# `allow` (or `exceptions`) list is denied. The `r-efi` exception below covers
# the one crate that offers a copyleft option (we use its MIT option).
version = 2

# Only auto-accept a license guessed from a LICENSE file when we are confident.
confidence-threshold = 0.8

# The allow-list is the set of permissive licenses actually used in this tree
# (see `cargo metadata` / the resolved graph).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unlicense",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "NCSA",
  "Unicode-3.0",
]

# `r-efi` is triple-licensed `MIT OR Apache-2.0 OR LGPL-2.1-or-later`. We use
# the permissive MIT/Apache-2.0 option (it enters the tree only via the
# dev/test graph). This exception documents that the LGPL option is deliberately
# not exercised; without it the default "deny anything not allowed" policy would
# flag it.
[[licenses.exceptions]]
name = "r-efi"
version = "*"
allow = ["MIT"]

# Tesseract and Leptonica are VENDORED and compiled from source at build time —
# they are NOT Cargo dependencies, so cargo-deny does not scan them. They are
# Apache-2.0 (Tesseract) and BSD-2-Clause (Leptonica), both permissive and
# already covered by the allow-list above, so no further handling is needed.

[bans]
# Multiple versions of the same crate are common and mostly harmless here; warn
# rather than fail so the gate only breaks on real problems.
multiple-versions = "warn"
wildcards = "allow"

[advisories]
# Advisories are also checked by `cargo audit`; keep the OSV/DB fresh.
yanked = "deny"
# `ttf-parser` is unmaintained (RUSTSEC-2026-0192) but has no safe upgrade — it
# is a transitive dependency of the PDF stack (lopdf / pdf-inspector /
# pdf-render), is widely used and well-tested, and cannot be replaced without an
# upstream change. Tracked in the security audit as a low-severity note.
# `paste` is likewise unmaintained (RUSTSEC-2024-0436) but still the de-facto
# proc-macro helper pulled in transitively (via darling -> rmcp-macros); it is
# stable and widely used.
ignore = [
  "RUSTSEC-2026-0192",
  "RUSTSEC-2024-0436",
  # zip 8.6.0 — see the comment below; tracked residual awaiting an upstream fix.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]

# zip 8.6.0 (RUSTSEC-2026-0367/0368/0369) — TARGETED ignore, not a blanket
# exclude. Fixed-don't-suppress: we bump everything we CAN to a patched version.
# Our own direct `zip` dependency and `calamine` are already on zip 9.0.5 (the
# fixed version), and `rustls`/`quinn-proto`/`chacha20` were patched too. The
# residual zip 8.6.0 is pulled in ONLY by `anydoc` (runtime, `zip ^8.6.0`) and
# `tesseract-rs` (build-time tessdata/source download, `zip ^8.6.0`), both of
# which still pin zip < 9 with no zip-9 release as of 2026-10 — so there is no
# safe upgrade path short of an upstream release or a vendored fork.
# The vulnerable `ZipArchive::extract()` / `ZipStreamReader::extract()` APIs
# (SUID/symlink escape) are NOT called by our own PPTX code — it only reads
# archive members via `by_name`/`by_index` into memory with a decompression cap.
# HOWEVER, `anydoc` DOES unpack untrusted documents at runtime, so this residual
# is tracked and must be re-checked as soon as anydoc/tesseract-rs move to
# zip >= 9 (or are forked). It is ignored here narrowly (these three concrete
# RUSTSEC IDs with a reason), NOT as a blanket `ignore = "RUSTSEC-*"`.
